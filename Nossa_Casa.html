<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nossa Casa</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nossa Casa">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6e5;--tx:#2b2350;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142b;--tx:#fff6e5}}
:root[data-theme="dark"]{--bg:#17142b;--tx:#fff6e5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
svg{display:block;width:100%;height:auto;shape-rendering:crispEdges}
.pf{font-family:"Press Start 2P",ui-monospace,monospace}
/* abertura */
.ic img,.stage img{display:block;width:100%;height:auto;image-rendering:pixelated}
#intro{position:fixed;inset:0;z-index:9;background:linear-gradient(#5ec3ff 0,#aee6ff 55%,#e8f9ff 100%);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;transition:opacity .4s}
#intro.out{opacity:0;pointer-events:none}
.sun{position:absolute;top:7%;right:9%;width:70px;height:70px;background:#ffe14d;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%);animation:pop .6s steps(6) both}
.cl{position:absolute;left:-90px;width:48px;height:16px;background:#fff;box-shadow:12px -12px #fff,28px -12px #fff,-8px 8px #fff3;animation:drift linear infinite}
.stage{position:relative;width:max(280px,min(96vw,580px,calc((100svh - 170px)*1.05)));aspect-ratio:1.05;flex:none}
.gr{left:-60vw;right:-60vw;bottom:0;height:26%;background:repeating-conic-gradient(#ddd8cf 0 25%,#cdc7bc 0 50%) 0 0/36px 36px;border-top:8px solid #9d978c}
.rd{left:-60vw;right:-60vw;bottom:0;height:5%;background:#4a4a55 repeating-linear-gradient(90deg,#f5d442 0 22px,transparent 22px 44px) 0 50%/auto 4px no-repeat;border-top:6px solid #b9b3a8}
.sky{left:-6%;width:112%;bottom:25%}
.stage>div{position:absolute}
.house{left:22%;width:56%;bottom:15%;animation:drop .8s ease-in .2s both}
.man{left:0;width:34%;bottom:4%;animation:wl 1.1s linear .9s both}
.wom{right:0;width:34%;bottom:4%;animation:wr 1.1s linear .9s both}
.man img,.wom img{transform-origin:50% 100%;animation:bob .28s steps(1) .9s 4,br 1.2s steps(1) 2.1s infinite}
.cat{left:50%;margin-left:-11%;width:22%;bottom:6%;transform-origin:50% 100%;animation:cd .9s ease-in 2s both}
.cat img{transform-origin:50% 100%;animation:br 1s steps(1) 3s infinite}
.bub{left:35%;bottom:25%;width:30%;transform-origin:50% 100%;animation:pop .45s steps(4) 3.2s both}
.bub .fd{position:absolute;left:50%;top:36%;width:44%;height:40%;transform:translate(-50%,-50%);opacity:0;animation:fo 2.4s infinite}
.bub .fd img{width:100%;height:100%;object-fit:contain}
.hr{left:31%;top:40%;width:6%;animation:fl 1.3s steps(9) 2.6s both}
.hr.b{left:63%;animation-delay:3s}
.sm{position:absolute;left:64%;top:30%;width:3.2%;aspect-ratio:1;background:#fff;opacity:0;animation:smk 1.8s steps(9) infinite}
.ttl{position:relative;z-index:2;display:flex;flex-direction:row;align-items:center;gap:10px;margin:0 0 4px;animation:drop2 .6s steps(6) 3.4s both}
.logo{font-family:Fredoka,system-ui,sans-serif;font-weight:700;line-height:.9}
.logo i,.logo b{font-style:normal;font-weight:700}
.lm img{display:block;width:100%;image-rendering:pixelated}
.ttl .lm{width:44px;margin:0}
.ttl i{font-size:clamp(1.5rem,6vw,2.2rem);color:#fff;text-shadow:-2px -2px 0 #2b2350,2px -2px 0 #2b2350,-2px 2px 0 #2b2350,2px 2px 0 #2b2350,0px -2px 0 #2b2350,0px 2px 0 #2b2350,-2px 0px 0 #2b2350,2px 0px 0 #2b2350,0px 5px 0 #2b2350}
.ttl b{font-size:clamp(2rem,9vw,3rem);color:#ffe14d;text-shadow:-2px -2px 0 #2b2350,2px -2px 0 #2b2350,-2px 2px 0 #2b2350,2px 2px 0 #2b2350,0px -2px 0 #2b2350,0px 2px 0 #2b2350,-2px 0px 0 #2b2350,2px 0px 0 #2b2350,0px 5px 0 #2b2350;letter-spacing:.02em}
.hl{display:flex;align-items:center;gap:14px;margin:6px 0 10px;font-size:clamp(2.1rem,10vw,3rem)}
.hl .lm{width:1.5em;flex:none}
.hl i{color:var(--tx)}
.hl b{color:#e8573f}
.gow{position:relative;display:flex;justify-content:center;margin-top:10px;animation:bnc .9s steps(2) infinite}
.go[hidden]{display:inline-block!important;visibility:hidden}
.go{pointer-events:auto;appearance:none;border:0;border-radius:6px;padding:14px 26px;background:#c98c47;color:#fff;font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:clamp(1.05rem,5vw,1.4rem);text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:inset 0 0 0 3px #e6b169,inset 0 0 0 5px #8a5326,0 0 0 3px #4a230a,0 6px 0 3px #3a1a06;cursor:pointer;animation:pop .35s steps(4) both;-webkit-tap-highlight-color:transparent}
.go:active{transform:translateY(5px)}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes drop{0%{transform:translateY(-110vh)}60%{transform:none}75%{transform:translateY(-9%)}90%{transform:none}100%{transform:none}}
@keyframes drop2{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
@keyframes wl{from{transform:translateX(-70vw)}to{transform:none}}
@keyframes wr{from{transform:translateX(70vw)}to{transform:none}}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-7%) rotate(2deg)}}
@keyframes br{0%{transform:none}50%{transform:scaleY(1.035)}}
@keyframes cd{0%{transform:translateY(-95vh)}70%{transform:none}78%{transform:scale(1.25,.75)}90%{transform:translateY(-10%) scale(.92,1.08)}100%{transform:none}}
@keyframes fo{0%,33.3%{opacity:1}33.4%,100%{opacity:0}}
@keyframes bnc{50%{transform:translateY(-5px)}}
@keyframes fl{0%{transform:translateY(0) scale(0);opacity:0}20%{transform:scale(1);opacity:1}100%{transform:translateY(-260%);opacity:0}}
@keyframes smk{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:.9}100%{transform:translate(40%,-420%) scale(1.8);opacity:0}}
@keyframes drift{to{transform:translateX(130vw)}}
/* home */
main{max-width:980px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:clamp(1.2rem,5.5vw,1.8rem);margin:6px 0 8px;line-height:1.4}
.sub{margin:0 0 22px;font-size:1.02rem;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
.tile{appearance:none;border:0;border-radius:6px;padding:10px;aspect-ratio:1;display:flex;flex-direction:column;gap:8px;background:#c98c47;box-shadow:inset 0 0 0 3px #e6b169,inset 0 0 0 5px #8a5326,0 0 0 3px #4a230a,0 8px 0 3px #3a1a06;cursor:pointer;animation:pop .35s steps(4) var(--d) both;-webkit-tap-highlight-color:transparent;font-family:Fredoka,system-ui,sans-serif}
.tile:active{transform:translateY(5px);box-shadow:inset 0 0 0 3px #e6b169,inset 0 0 0 5px #8a5326,0 0 0 3px #4a230a,0 3px 0 3px #3a1a06}
.slot{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#f3cf8d;border-radius:4px;box-shadow:inset 0 0 0 2px #d8a85d,inset 0 4px 0 2px #c28f45}
.slot .ic{width:56%}
.lbl{background:var(--c);color:#fff;border-radius:4px;padding:7px 4px;font-weight:700;font-size:clamp(.8rem,3.3vw,1.05rem);line-height:1.1;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 0 0 2px rgba(0,0,0,.35)}
.grid{gap:26px 16px}
@media(min-width:700px){.grid{gap:30px 24px}}
.sign{background:#fbe6b6;color:#4a230a;border-radius:6px;padding:16px 18px;margin:8px 7px 34px;box-shadow:0 0 0 4px #8a5326,0 0 0 7px #4a230a,0 8px 0 7px #3a1a06}
.sign .hl{margin:0 0 6px}.sign .hl i{color:#4a230a}
.sign .sub{margin:0;color:#6b3a14;opacity:1;font-family:Fredoka,system-ui,sans-serif;font-weight:700}
.vh{border-radius:6px;box-shadow:0 0 0 4px #4a230a,0 7px 0 4px #3a1a06}
#back{background:#8a5326;color:#fff;border-radius:6px;font-family:Fredoka,system-ui,sans-serif;box-shadow:0 0 0 3px #4a230a,0 5px 0 3px #3a1a06}
.soon{background:#fbe6b6;color:#4a230a;padding:14px 16px;border-radius:6px;box-shadow:0 0 0 4px #8a5326,0 0 0 7px #4a230a;font-family:Fredoka,system-ui,sans-serif;margin:24px 7px 0}
.tile:focus-visible,#back:focus-visible{outline:4px solid var(--tx);outline-offset:3px}
.ic{width:62%}
#view{max-width:980px;margin:0 auto;padding:22px 18px}
#back{appearance:none;border:0;background:var(--tx);color:var(--bg);font:700 1rem system-ui;padding:12px 18px;border-radius:14px;cursor:pointer}
.vh{margin-top:20px;border-radius:24px;padding:28px 20px;background:var(--c);color:#fff;display:flex;align-items:center;gap:18px}
.vh .ic{width:84px;flex:none}
.vh h2{margin:0;font-size:1.5rem}
.soon{margin-top:18px;font-size:1.05rem;opacity:.85}
[hidden]{display:none!important}

.tile{position:relative}
.bd{position:absolute;top:-12px;right:-10px;background:#e8412f;color:#fff;border-radius:99px;min-width:30px;padding:2px 8px;font:700 .95rem Fredoka,system-ui;font-style:normal;text-align:center;box-shadow:0 0 0 3px #4a230a}
.vh small{display:block;font:600 1rem Fredoka,system-ui;margin-top:4px}
.sec{display:inline-block;background:#8a5326;color:#fff;font:700 1rem Fredoka,system-ui;padding:6px 14px;border-radius:6px;box-shadow:0 0 0 3px #4a230a;margin:22px 4px 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fbe6b6;color:#4a230a;border-radius:6px;padding:10px 12px;margin:0 6px 16px;box-shadow:0 0 0 3px #8a5326,0 5px 0 3px #4a230a;font-family:Fredoka,system-ui,sans-serif}
.row.low{background:#ffd9b0}
.nm{font-weight:700;font-size:1.05rem;flex:1 1 150px}.nm small{display:block;font-weight:600;font-size:.82rem;opacity:.75}
.low .nm small{color:#b32a1e;opacity:1}
.st{display:flex;align-items:center;gap:6px}.st b{min-width:54px;text-align:center;font-size:1.25rem}
.st button{width:46px;height:46px;border:0;border-radius:6px;background:var(--c);color:#fff;font:700 1.6rem Fredoka,system-ui;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px #4a230a;cursor:pointer}
.st button:active{transform:translateY(3px)}
input,select{font:600 1rem Fredoka,system-ui,sans-serif;padding:8px;border:2px solid #8a5326;border-radius:4px;background:#fff8e6;color:#4a230a;min-width:0}
.ed input[data-f=n],#an{flex:1 1 150px}.ed input[data-f=m],#am{width:72px}.ed input[data-f=u],#au{width:96px}#at{flex:1 1 140px}
#add,[data-del]{border:0;border-radius:6px;color:#fff;font:700 1rem Fredoka,system-ui;padding:10px 14px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px #4a230a}
#add{background:#1fa56b}[data-del]{background:#e8412f;padding:8px 12px}
.emp{background:#fbe6b6;color:#4a230a;padding:14px;border-radius:6px;margin:20px 6px;font-family:Fredoka,system-ui}
.tile.wide{grid-column:1/-1;aspect-ratio:auto;flex-direction:row;min-height:104px;order:-1}
.tile.wide .slot{flex:0 0 96px}.tile.wide .lbl{flex:1;display:flex;align-items:center;justify-content:center;font-size:1.35rem}
.buy{cursor:pointer;justify-content:flex-start;flex-wrap:nowrap}.buy input{width:26px;height:26px;accent-color:#1fa56b;flex:none}.buy.got{opacity:.55}.buy.got .nm{text-decoration:line-through}
.act{background:none;box-shadow:none;padding:0;justify-content:flex-start}
#cp,#clr{border:0;border-radius:6px;color:#fff;font:700 1rem Fredoka,system-ui;padding:10px 14px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px #4a230a}
#cp{background:#3f6df0}#clr{background:#8a5326}
button,label,input,select{touch-action:manipulation}.st button,.tile{-webkit-user-select:none;user-select:none}
#back{background:#8a5326;color:#fff;position:sticky;top:8px;z-index:5}
#body{margin-top:22px}
.ed input[data-f=u],#au{width:120px}
.buy.got{opacity:1;background:#cfe8b0}.buy.got .nm{opacity:.6}
#sp,#rc,[data-delp]{border:0;border-radius:6px;color:#fff;font:700 1rem Fredoka,system-ui;padding:10px 14px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px #4a230a}
#sp{background:#0f9d8a;flex:1 1 100%}#rc{background:#d6336c}[data-delp]{background:#e8412f;padding:8px 12px}
#pd,#pv,#pp,#pn{flex:1 1 130px}.chk{flex:1 1 100%;display:flex;align-items:center;gap:8px;font-weight:600}.chk input{width:22px;height:22px;accent-color:#1fa56b}
.row.chart{display:block}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#back{top:calc(env(safe-area-inset-top,0px) + 8px);min-height:48px;padding:12px 22px}
input,select{min-height:46px}
#add,[data-del],[data-delp],#cp,#clr,#rc,#sp{min-height:46px}[data-del],[data-delp]{min-width:46px}
@media(max-width:600px){
main{padding:14px 14px 28px}
.sign{padding:12px 14px;margin:4px 6px 26px}.sign .hl{margin:0 0 2px;gap:10px;font-size:clamp(1.8rem,8vw,2.3rem)}.sign .sub{font-size:.95rem}
.grid{gap:26px 14px}
.tile:not(.wide){aspect-ratio:auto;height:clamp(124px,17.5svh,190px)}
.tile.wide{min-height:clamp(78px,10.5svh,104px)}
.tile.wide .slot{flex:0 0 clamp(72px,10svh,96px)}
.vh{margin-top:12px;padding:14px 16px;border-radius:16px;gap:14px}.vh .ic{width:58px}.vh h2{font-size:1.3rem}.vh small{margin-top:2px}
#view{padding:14px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.sec{margin:16px 4px 12px}
}
/* Pequeno polimento: mantém o visual colorido de jogo do original. */
:root{--bg:#fff6e5;--tx:#2b2350}
.tile{transition:filter .15s ease,transform .15s ease}
.tile:hover{filter:brightness(1.08) saturate(1.08);transform:translateY(-3px)}
.tile:active{filter:brightness(.98)}
.stage .house img,.stage .man img,.stage .wom img,.stage .cat img{filter:drop-shadow(0 3px 0 #2b1d1d88) drop-shadow(0 7px 5px #2b1d1d45)}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div id="intro">
  <div class="sun"></div>
  <div class="cl" style="top:15%;animation-duration:24s"></div>
  <div class="cl" style="top:27%;animation-duration:32s;animation-delay:-14s"></div>
  <div class="ttl logo"><span class="lm" id="lg1"></span><i>Nossa</i><b>Casa</b></div>
  <div class="stage">
    <div class="gr"></div><div class="rd"></div><div class="sky" id="sS"></div>
    <div class="house" id="sH"></div>
    
    <div class="man" id="sM"></div>
    <div class="wom" id="sW"></div>
    <div class="cat" id="sC"></div>
    <div class="bub" id="sB"></div>
    <div class="hr" id="h1"></div><div class="hr b" id="h2"></div>
  </div>
  <div class="gow"><button class="go" id="go" hidden>Aperte para começar</button></div>
</div>

<main id="home">
  <div class="sign"><div class="logo hl"><span class="lm" id="lg2"></span><span><i>Nossa</i> <b>Casa</b></span></div><p class="sub">O que vamos organizar hoje?</p></div>
  <div class="grid" id="grid"></div>
</main>

<section id="view" hidden>
  <button id="back">Voltar</button>
  <div class="vh" id="vh"></div>
  <div id="body"></div>
</section>

<script>
const P={o:'#2a1a1a',w:'#fff',b:'#4aa3ff',q:'#ff7a5c',r:'#e8412f'};
const IP={a:'#fff',d:'#2b2350',w:'#ffe14d'};
function cv(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'));return `<img alt="" src="${c.toDataURL()}">`}
const px=(x,c,a,b,w,h)=>{x.fillStyle=c;x.fillRect(a,b,w||1,h||1)};
const R=px;
function spr(g,p){const r=g.trim().split('\n'),w=Math.max(...r.map(l=>l.length));return cv(w,r.length,x=>r.forEach((l,y)=>[...l].forEach((c,i)=>p[c]&&px(x,p[c],i,y))))}
function mk(w,h,f){return cv(w,h,x=>{x.save();x.translate(1,1);f(x);x.restore();const a=x.getImageData(0,0,w,h).data,o=(i,j)=>i>=0&&j>=0&&i<w&&j<h&&a[(j*w+i)*4+3]>0;x.fillStyle='#2b1d1d';for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(!o(i,j)&&(o(i-1,j)||o(i+1,j)||o(i,j-1)||o(i,j+1)))x.fillRect(i,j,1,1)})}
const E=(x,c,cx,cy,rx,ry)=>{x.fillStyle=c;for(let j=-ry;j<=ry;j++)for(let i=-rx;i<=rx;i++)if(i*i/(rx*rx+.5)+j*j/(ry*ry+.5)<=1)x.fillRect(Math.round(cx+i),Math.round(cy+j),1,1)};
const O=(x,cx,cy,rx,ry,b,s,h)=>{E(x,s,cx,cy,rx,ry);E(x,b,cx-1,cy-1,rx-1,ry-1);if(h)E(x,h,cx-rx*.45,cy-ry*.5,Math.max(1,rx*.25),Math.max(1,ry*.2))};
const eyes=(x,c)=>{R(x,c,10,15,3,5);R(x,c,19,15,3,5);R(x,'#fff',10,15,1,1);R(x,'#fff',19,15,1,1);R(x,'#ff9a8a',7,20,3,1);R(x,'#ff9a8a',22,20,3,1)};
const MAN=()=>mk(34,50,x=>{
 const sk='#f2b98f',sd='#d98f66',hc='#4a2e1f',hl='#7a523a';
 R(x,'#e8412f',10,36,5,9);R(x,'#b32a1e',14,36,1,9);R(x,'#e8412f',17,36,5,9);R(x,'#b32a1e',21,36,1,9);
 R(x,'#2a2a2e',9,44,7,4);R(x,'#2a2a2e',16,44,7,4);R(x,'#55555e',10,44,4,1);R(x,'#55555e',17,44,4,1);R(x,'#111114',9,47,7,1);R(x,'#111114',16,47,7,1);
 for(const a of [4,23]){R(x,'#e8412f',a,27,5,9);R(x,'#b32a1e',a+(a<10?4:0),27,1,9);R(x,'#d9dee3',a,30,5,1);R(x,'#8f98a1',a,31,5,1);R(x,sk,a,36,5,2);R(x,sd,a,38,5,1)}
 R(x,'#b32a1e',9,27,14,10);R(x,'#e8412f',9,27,12,9);R(x,'#ff7a5c',10,28,2,5);
 R(x,'#b32a1e',12,25,8,3);R(x,'#c9ced4',15,26,1,11);R(x,'#b32a1e',17,29,4,3);R(x,'#e8412f',17,29,3,2);
 R(x,'#d9dee3',9,33,14,1);R(x,'#8f98a1',9,34,14,1);R(x,'#d9dee3',10,40,5,1);R(x,'#8f98a1',10,41,5,1);R(x,'#d9dee3',17,40,5,1);R(x,'#8f98a1',17,41,5,1);
 O(x,16,10,13,10,hc,'#3b2418',hl);
 O(x,16,17,11,9,sk,sd,'#ffd9b8');
 R(x,sk,4,15,2,4);R(x,sk,26,15,2,4);
 for(let i=6;i<=26;i++)R(x,hc,i,5,1,5+(i*7)%3);
 R(x,hl,9,6,5,1);R(x,hl,18,6,4,1);R(x,hc,5,10,2,7);R(x,hc,25,10,2,7);
 eyes(x,'#255f3b');R(x,hc,9,13,5,1);R(x,hc,18,13,5,1);R(x,sd,15,18,2,2);
 // clean-shaven face: just a small warm smile, no beard or moustache
 R(x,'#bd6c68',15,22,3,1);
 // a little extra suit stitching and reflective glint, within the original silhouette
 R(x,'#ff9a6a',11,29,1,4);R(x,'#9e241f',20,30,1,6);R(x,'#fff2ad',10,33,3,1);R(x,'#fff2ad',21,33,3,1);

const items=()=>{const o=IT0.map(i=>({...i,...(S.it[i.id]||{})}));for(const id in S.it)if(id[0]=='c')o.push({id,...S.it[id]});return o.filter(i=>!i.x)};
const q=i=>S.q[i.id]||0,stp=u=>/^kg/.test(u)?.5:/^g$/.test(u)?100:1,fmt=n=>String(Math.round(n*100)/100).replace('.',','),esc=t=>String(t).replace(/"/g,'&quot;');
const mg=(a,b)=>{for(const k in b){const v=b[k];if(v&&typeof v=='object'){if(!a[k]||typeof a[k]!='object')a[k]={};mg(a[k],v)}else a[k]=v}return a};
const cl=o=>JSON.parse(JSON.stringify(o)),cj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
function cache(){try{localStorage.setItem('nc',JSON.stringify(S))}catch(e){}}
function patch(p){mg(S,p);mg(PD,p);cache();clearTimeout(tm);tm=setTimeout(flush,350)}
async function flush(){if(!db||F||ex===null||!Object.keys(PD).length)return;F=PD;PD={};const r=db.doc('casa/estoque');
 try{if(ex)await r.update(F);else{await r.set(cl(S));ex=true}}
 catch(e){if(e&&e.code=='invalid_argument')ex=false;PD=mg(F,PD);F=null;clearTimeout(tm);tm=setTimeout(flush,4000);return}
 F=null;if(Object.keys(PD).length){clearTimeout(tm);tm=setTimeout(flush,350)}}
function badges(){const it=items();document.querySelectorAll('.tile').forEach(b=>{const k=+b.dataset.k,n=it.filter(i=>(k==6||i.t==k)&&q(i)<i.m).length,e=b.querySelector('.bd');e.textContent=n;e.hidden=!n||k==5})}

const BRL=n=>'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),
 td=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
 MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],
 pv=v=>{v=String(v).trim();return v?parseFloat(v.includes(',')?v.replace(/\./g,'').replace(',','.'):v):NaN},
 hx=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const buys=()=>{const o=[];for(const id in S.pc){const p=S.pc[id];if(p&&!p.x&&p.d&&p.v>=0)o.push({id,...p})}return o.sort((a,b)=>(b.d+b.id)<(a.d+a.id)?-1:1)};
function buy(b){const L=buys(),now=new Date(),k0=now.getFullYear()*12+now.getMonth(),ms=[];
 for(let i=5;i>=0;i--){const k=k0-i;ms.push({k,l:MS[k%12],t:0})}
 L.forEach(p=>{const[y,m]=p.d.split('-'),e=ms.find(x=>x.k==+y*12+(+m-1));if(e)e.t+=p.v});
 const mx=Math.max(...ms.map(x=>x.t),1),n=L.filter(p=>p.d.slice(0,7)==td().slice(0,7)).length,ck=S.ck||{},mkd=items().filter(i=>q(i)<i.m&&ck[i.id]).length;
 $('cnt').textContent=L.length+(L.length==1?' compra registrada':' compras registradas');
 const W=330,bw=38,gp=(W-6*bw)/7;let sv=`<svg viewBox="0 0 ${W} 176" role="img" aria-label="Gastos por mês">`;
 ms.forEach((x,i)=>{const h=Math.round(x.t/mx*110),X=Math.round(gp+i*(bw+gp)),Y=140-h,f='font-family="Fredoka,system-ui" font-weight="700" text-anchor="middle" fill="#4a230a"';
  if(h)sv+=`<rect x="${X}" y="${Y}" width="${bw}" height="${h}" fill="${i==5?'#d6336c':'#0f9d8a'}" stroke="#4a230a" stroke-width="3"/><text x="${X+bw/2}" y="${Y-7}" font-size="12" ${f}>${Math.round(x.t)}</text>`;
  sv+=`<text x="${X+bw/2}" y="162" font-size="13" ${f}>${x.l}</text>`});
 sv+=`<line x1="0" y1="141" x2="${W}" y2="141" stroke="#4a230a" stroke-width="3"/></svg>`;
 let h=`<h3 class="sec">Novo registro</h3><div class="row"><input id="pd" type="date" value="${td()}"><input id="pv" inputmode="decimal" placeholder="Valor (R$)"><select id="pp"><option>Pix</option><option>Débito</option><option>Crédito</option><option>Dinheiro</option><option>Vale-refeição</option></select><input id="pn" placeholder="Local">${mkd?`<label class="chk"><input type="checkbox" id="pe" checked>Dar entrada nos ${mkd} ${mkd==1?'item marcado':'itens marcados'} da lista</label>`:''}<button id="sp">Salvar compra</button></div>`;
 h+=`<h3 class="sec">Gastos por mês</h3><div class="row"><div class="nm">Este mês<small>${n} ${n==1?'compra':'compras'}</small></div><b style="font-size:1.4rem">${BRL(ms[5].t)}</b></div><div class="row chart">${sv}</div><h3 class="sec">Histórico</h3>`;
 h+=L.length?L.slice(0,40).map(p=>`<div class="row"><div class="nm">${BRL(p.v)}<small>${p.d.split('-').reverse().join('/')} · ${hx(p.p||'')}${p.n?' · '+hx(p.n):''}</small></div><button data-delp="${p.id}">✕</button></div>`).join(''):'<p class="emp">Nenhuma compra registrada ainda. Preencha o valor e a data acima ao voltar do mercado.</p>';
 b.innerHTML=h}
function render(){const it=items(),b=$('body');
 if(cur==7){buy(b);return}
 if(cur==6){const need=it.filter(i=>q(i)<i.m),ck=S.ck||{};$('cnt').textContent=need.length?`${need.length} ${need.length==1?'item':'itens'} para comprar · ${(n=>n+(n==1?' marcado':' marcados'))(need.filter(i=>ck[i.id]).length)}`:'Nada faltando!';
  let h=need.length?'<div class="row act"><button id="cp">Copiar lista</button><button id="clr">Limpar marcações</button><button id="rc">Registrar compra</button></div>':'<p class="emp">Tudo em dia! Quando um item ficar abaixo do mínimo, ele aparece aqui.</p>';
  T.slice(0,5).forEach((t,k)=>{const L=need.filter(i=>i.t==k);if(!L.length)return;h+=`<h3 class="sec">${t.n}</h3>`;L.forEach(i=>{const c=ck[i.id];h+=`<label class="row buy${c?' got':''}"><input type="checkbox" data-k="${i.id}"${c?' checked':''}><span class="nm">${i.n}<small>comprar ${fmt(i.m-q(i))} ${i.u}</small></span></label>`})});
  b.innerHTML=h;return}
 if(cur==5){$('cnt').textContent=it.length+' itens cadastrados';
  let h='<div class="row add"><input id="an" placeholder="Novo item"><input id="am" inputmode="decimal" placeholder="Mín."><input id="au" placeholder="Unidade"><select id="at">'+T.slice(0,5).map((t,k)=>`<option value="${k}">${t.n}</option>`).join('')+'</select><button id="add">Adicionar</button></div>';
  T.slice(0,5).forEach((t,k)=>{h+=`<h3 class="sec">${t.n}</h3>`;it.filter(i=>i.t==k).forEach(i=>{h+=`<div class="row ed"><input data-f="n" data-i="${i.id}" value="${esc(i.n)}"><input data-f="m" data-i="${i.id}" inputmode="decimal" value="${fmt(i.m)}"><input data-f="u" data-i="${i.id}" value="${esc(i.u)}"><button data-del="${i.id}">✕</button></div>`})});
  b.innerHTML=h;return}
 const L=it.filter(i=>i.t==cur);$('cnt').textContent=`faltam ${L.filter(i=>q(i)<i.m).length} de ${L.length} itens`;
 let h='',s='';L.forEach(i=>{if(i.s!=s){s=i.s;h+=`<h3 class="sec">${s}</h3>`}const f=q(i)<i.m;
  h+=`<div class="row${f?' low':''}"><div class="nm">${i.n}<small>${f?'falta '+fmt(i.m-q(i))+' '+i.u:'ok'} · mín. ${fmt(i.m)} ${i.u}</small></div><div class="st"><button data-i="${i.id}" data-d="-1">−</button><b>${fmt(q(i))}</b><button data-i="${i.id}" data-d="1">+</button></div></div>`});
 b.innerHTML=h||'<p class="emp">Nada por aqui ainda. Adicione itens em Controle de itens.</p>'}
$('body').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.d){const i=items().find(x=>x.id==b.dataset.i);if(!i)return;patch({q:{[i.id]:Math.max(0,Math.round((q(i)+b.dataset.d*stp(i.u))*100)/100)}});render()}
 else if(b.dataset.del){const id=b.dataset.del;patch({it:{[id]:{x:1}},q:{[id]:0},ck:{[id]:0}});render()}
 else if(b.id=='add'){const n=$('an').value.trim();if(!n)return;patch({it:{['c'+Date.now()]:{n,m:parseFloat($('am').value.replace(',','.'))||1,u:$('au').value.trim()||'unidade',t:+$('at').value,s:'Outros'}}});render()}
 else if(b.id=='sp'){const v=pv($('pv').value),d=$('pd').value;if(!(v>0)||!d){$('pv').focus();return}
  const o={pc:{['p'+Date.now()]:{d,v:Math.round(v*100)/100,p:$('pp').value,n:$('pn').value.trim()}}};
  if($('pe')&&$('pe').checked){o.q={};o.ck={};items().forEach(i=>{if(q(i)<i.m&&S.ck[i.id]){o.q[i.id]=i.m;o.ck[i.id]=0}})}
  patch(o);render()}
 else if(b.dataset.delp){if(b.dataset.sure){patch({pc:{[b.dataset.delp]:{x:1}}});render()}else{b.dataset.sure=1;b.textContent='Apagar?';setTimeout(()=>{delete b.dataset.sure;b.textContent='✕'},3000)}}
 else if(b.id=='rc'){openTab(7)}
 else if(b.id=='clr'){const o={};for(const k in S.ck)o[k]=0;patch({ck:o});render()}
 else if(b.id=='cp'){const it=items().filter(i=>q(i)<i.m),tx=T.slice(0,5).map((t,k)=>{const L=it.filter(i=>i.t==k);return L.length?t.n.toUpperCase()+'\n'+L.map(i=>`- ${i.n}: ${fmt(i.m-q(i))} ${i.u}`).join('\n'):''}).filter(Boolean).join('\n\n');(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>{b.textContent='Copiado!'},()=>{b.textContent='Copie o texto abaixo';let t=$('ctx');if(!t){t=document.createElement('textarea');t.id='ctx';t.readOnly=true;t.rows=12;t.style.cssText='width:calc(100% - 12px);margin:0 6px 16px;font:600 1rem Fredoka,system-ui;padding:10px';b.parentNode.after(t)}t.value=tx;t.focus();t.select()})}});
$('body').addEventListener('change',e=>{const kk=e.target.dataset.k;if(kk){patch({ck:{[kk]:e.target.checked?1:0}});render();return}const f=e.target.dataset.f;if(!f)return;let v=e.target.value;if(f=='m')v=Math.max(0,parseFloat(v.replace(',','.'))||0);patch({it:{[e.target.dataset.i]:{[f]:v}}});badges()});
function openTab(k){cur=k;const t=T[cur];
 $('view').style.setProperty('--c',t.c);$('vh').style.setProperty('--c',t.c);
 $('vh').innerHTML=`<span class="ic">${ICO[t.i]()}</span><div><h2>${t.n}</h2><small id="cnt"></small></div>`;
 $('home').hidden=true;$('view').hidden=false;render();scrollTo(0,0)}
$('grid').addEventListener('click',e=>{const b=e.target.closest('.tile');if(b)openTab(+b.dataset.k)});
$('back').onclick=()=>{cur=-1;$('view').hidden=true;$('home').hidden=false;badges()};
badges();
(async()=>{try{db=window.claude&&await claude.use('db')}catch(e){}if(!db)return;
 db.doc('casa/estoque').onSnapshot(sn=>{
  if(!sn.exists){if(!sn.metadata.fromCache){ex=false;flush()}return}
  ex=true;const d=sn.data(),n=mg(mg({q:cl(d.q||{}),it:cl(d.it||{}),ck:cl(d.ck||{}),pc:cl(d.pc||{})},F||{}),PD);
  if(cj(n)!=cj(S)){S=n;cache();if(!(document.activeElement&&document.activeElement.tagName=='INPUT')){badges();if(cur>=0)render()}}
  flush()},()=>{})})();
let done=false;function end(){if(done)return;done=true;$('intro').classList.add('out');setTimeout(()=>$('intro').remove(),450)}
$('go').onclick=end;const rdy=()=>{$('go').hidden=false};
if(matchMedia('(prefers-reduced-motion: reduce)').matches)rdy();else setTimeout(rdy,4200);
</script>
</body>
